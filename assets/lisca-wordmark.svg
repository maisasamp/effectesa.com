<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 120" width="430" height="120">
  <!-- Lisca wordmark: orange fishbone + lowercase wordmark -->
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2A93B"/>
      <stop offset="1" stop-color="#C6502E"/>
    </linearGradient>
  </defs>
  <g stroke="url(#lg)" stroke-width="7" fill="none" stroke-linecap="round">
    <!-- spine -->
    <line x1="8" y1="60" x2="138" y2="60"/>
    <!-- ribs (three chevron pairs, angled toward tail on the left) -->
    <line x1="52" y1="60" x2="76" y2="26"/>
    <line x1="52" y1="60" x2="76" y2="94"/>
    <line x1="78" y1="60" x2="102" y2="26"/>
    <line x1="78" y1="60" x2="102" y2="94"/>
    <line x1="104" y1="60" x2="121" y2="36"/>
    <line x1="104" y1="60" x2="121" y2="84"/>
  </g>
  <!-- head -->
  <rect x="134" y="44" width="12" height="32" rx="5" fill="url(#lg)"/>
  <text x="172" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="82" letter-spacing="1" fill="#E7E2DA">lisca</text>
  <circle cx="366" cy="82" r="9" fill="#E58133"/>
</svg>
